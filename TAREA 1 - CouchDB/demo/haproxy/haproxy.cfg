# VIP delante de los dos masters. Los clientes (las tres UI) le hablan a
# esto, nunca a couch-central o couch-central-b directamente — es la
# respuesta de produccion a "y si el master que elegiste esta caido":
# no lo elegis vos, lo elige el health check.
global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    # timeout connect bajo + pocos reintentos: en localhost/docker-bridge la
    # red es rapida, asi que un backend caido se descarta enseguida en vez
    # de hacer esperar al cliente. Sin esto, un request que cae justo en el
    # corte puede tardar 15s en devolver 503 antes de pasar al backup.
    timeout connect 1s
    timeout client  30s
    timeout server  30s
    retries 1

frontend fe_inspecciones
    bind *:5984
    default_backend be_masters

# active-backup, no round robin: la replicacion entre los dos masters es
# eventual, asi que repartir requests parejo entre los dos puede hacer que
# un cliente escriba en uno y, un instante despues, lea del otro sin ver
# todavia su propio cambio. Con "backup" todo el trafico va a central-a
# mientras este sano, y pasa a central-b solo si central-a falla el check.
backend be_masters
    option httpchk GET /_up
    http-check expect status 200
    server central-a couch-central:5984   check inter 1s fall 2 rise 2
    server central-b couch-central-b:5984 check inter 1s fall 2 rise 2 backup

# Dashboard en vivo de a que backend esta mandando trafico y por que.
listen stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 3s
    stats show-legends
