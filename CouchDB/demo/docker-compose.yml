services:
  couch-central:
    image: couchdb:3.5
    container_name: ose-central
    ports:
      - "5984:5984"
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: admin123
    volumes:
      - central-data:/opt/couchdb/data

  # Segundo master del central. No es una replica de solo lectura: acepta
  # escrituras igual que el primero, y los dos se replican entre si de forma
  # continua. Si uno se cae, el otro sigue atendiendo.
  couch-central-b:
    image: couchdb:3.5
    container_name: ose-central-b
    ports:
      - "5987:5984"
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: admin123
    volumes:
      - central-b-data:/opt/couchdb/data

  couch-tablet:
    image: couchdb:3.5
    container_name: ose-tablet
    ports:
      - "5985:5984"
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: admin123
    volumes:
      - tablet-data:/opt/couchdb/data

  # La tablet B no tiene contenedor: corre PouchDB dentro del navegador
  # (ui/tablet-b), guardando en IndexedDB y replicando contra couch-central.

volumes:
  central-data:
  central-b-data:
  tablet-data:
