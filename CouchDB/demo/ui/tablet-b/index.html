<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSE Móvil — Tablet B</title>
<style>
  :root{
    --bg:#eae6d9;
    --device:#f2f0e7;
    --surface:#ffffff;
    --ink:#1d1b15;
    --ink-dim:#5c5748;
    --accent:#2f5f8a;
    --accent-tint:#dde6ee;
    --ok:#2c6e63;
    --ok-tint:#dcece7;
    --warn:#b8781a;
    --warn-tint:#f5e7cf;
    --crit:#a3261a;
    --crit-tint:#f7ddd8;
    --line:#ddd6c2;
    --font: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); display:flex; justify-content:center; padding:28px 14px;}

  .device{
    width:100%; max-width:420px; background:var(--device);
    border:1px solid var(--line); border-radius:26px;
    padding:18px 18px 22px; box-shadow:0 20px 40px -24px rgba(0,0,0,.35);
  }
  .cam{width:8px; height:8px; border-radius:50%; background:var(--line); margin:0 auto 14px;}

  header{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px;}
  header h1{font-size:17px; margin:0 0 2px; font-weight:700;}
  header p{margin:0; font-size:11.5px; color:var(--ink-dim); font-family:var(--mono);}

  .toggle{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:6px 10px 6px 6px; cursor:pointer; user-select:none;}
  .dot{width:9px; height:9px; border-radius:50%; background:#b23a2f; flex:none; transition:background .2s;}
  .device[data-online="1"] .dot{background:var(--ok);}
  .toggle span{font-size:11.5px; font-weight:600; font-family:var(--mono);}

  form{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:9px; margin-bottom:14px;}
  form h2{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-dim); margin:0 0 2px; font-weight:600;}
  .row{display:flex; gap:8px;}
  .row > *{flex:1;}
  label{font-size:10.5px; color:var(--ink-dim); font-family:var(--mono); display:block; margin-bottom:3px;}
  input, select{width:100%; font:inherit; font-size:13.5px; padding:8px 9px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink);}
  input:focus, select:focus{outline:2px solid var(--accent); outline-offset:1px;}
  button{font:inherit; cursor:pointer; border:none; border-radius:8px; padding:10px 14px; font-weight:600; font-size:13.5px;}
  .btn-primary{background:var(--accent); color:#fff8f3;}
  .btn-primary:disabled{opacity:.4; cursor:not-allowed;}
  .btn-sync{width:100%; background:var(--ok); color:#fff; display:flex; align-items:center; justify-content:center; gap:8px;}
  .btn-sync:disabled{background:var(--line); color:var(--ink-dim); cursor:not-allowed;}

  .section-title{display:flex; justify-content:space-between; align-items:baseline; margin:0 0 8px;}
  .section-title h2{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-dim); margin:0; font-weight:600;}
  .pending-count{font-family:var(--mono); font-size:11px; color:var(--warn);}

  .list{display:flex; flex-direction:column; gap:7px; max-height:340px; overflow-y:auto; margin-bottom:14px;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 12px; display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .card .meta{min-width:0;}
  .card .id{font-family:var(--mono); font-size:11px; color:var(--ink-dim);}
  .card .desc{font-size:13.5px; font-weight:600; margin-top:1px;}
  .card .val{font-family:var(--mono); font-size:12.5px; color:var(--ink-dim); margin-top:1px;}
  .badge{font-family:var(--mono); font-size:10px; padding:3px 8px; border-radius:999px; white-space:nowrap; flex:none;}
  .badge.pend{background:var(--warn-tint); color:var(--warn);}
  .badge.sync{background:var(--ok-tint); color:var(--ok);}
  .badge.conf{background:var(--crit-tint); color:var(--crit);}
  .empty{font-size:12.5px; color:var(--ink-dim); text-align:center; padding:18px 0;}

  .card{flex-direction:column; align-items:stretch;}
  .card-top{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .badges{display:flex; flex-direction:column; gap:4px; align-items:flex-end;}
  .edit-link{background:none; border:none; padding:0; font-family:var(--mono); font-size:10px; color:var(--ink-dim); text-decoration:underline; cursor:pointer; margin-top:4px; align-self:flex-start;}
  .edit-row{display:flex; gap:6px; margin-top:8px;}
  .edit-row input{flex:1;}
  .btn-mini{padding:6px 10px; font-size:11.5px; border-radius:6px;}
  .btn-mini.save{background:var(--ok); color:#fff;}
  .btn-mini.cancel{background:var(--line); color:var(--ink-dim);}

  .btn-secondary{width:100%; background:var(--surface); color:var(--ink); border:1px solid var(--line); margin-top:8px;}
  .btn-secondary:disabled{opacity:.4; cursor:not-allowed;}

  .toast{font-size:12px; font-family:var(--mono); background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:9px 11px; color:var(--ink-dim); min-height:16px;}
  .toast.ok{color:var(--ok); border-color:var(--ok);}
  .toast.err{color:var(--accent); border-color:var(--accent);}

  #tip-float{
    position:fixed; z-index:9999; pointer-events:none;
    background:var(--ink); color:var(--device); font-family:var(--mono); font-size:10.5px; line-height:1.45;
    padding:7px 10px; border-radius:7px; max-width:250px; white-space:pre-line;
    box-shadow:0 10px 24px -10px rgba(0,0,0,.5);
    opacity:0; transform:translateY(2px); transition:opacity .12s ease, transform .12s ease;
  }
  #tip-float.show{opacity:1; transform:translateY(0);}
</style>
</head>
<body>
  <div class="device" id="device" data-online="0">
    <div class="cam"></div>
    <header>
      <div>
        <h1>OSE Móvil — B</h1>
        <p>inspector: mgonzalez · nodo :5986</p>
      </div>
      <div class="toggle" id="toggle">
        <span class="dot"></span>
        <span id="toggle-label">SIN CONEXIÓN</span>
      </div>
    </header>

    <form id="form">
      <h2>Nueva lectura</h2>
      <div class="row">
        <div>
          <label for="medidor">Medidor</label>
          <input id="medidor" placeholder="OSE-4471" required>
        </div>
        <div>
          <label for="zona">Zona</label>
          <select id="zona">
            <option>Canelones-Este</option>
            <option>Canelones-Oeste</option>
            <option>Florida-Norte</option>
          </select>
        </div>
      </div>
      <div>
        <label for="valor">Valor (m³)</label>
        <input id="valor" type="number" step="0.1" placeholder="18452.7" required>
      </div>
      <button class="btn-primary" type="submit" data-tip="PUT /inspecciones/{id}&#10;Crea el documento en esta tablet, sin tocar el central">Guardar lectura (local)</button>
    </form>

    <div class="section-title">
      <h2>Lecturas en esta tablet</h2>
      <span class="pending-count" id="pending-count">— pendientes</span>
    </div>
    <div class="list" id="list"><p class="empty">Cargando…</p></div>

    <button class="btn-sync" id="sync-btn" disabled data-tip="POST /_replicate&#10;source: esta tablet &#8594; target: central">Sincronizar con central</button>
    <button class="btn-secondary" id="pull-btn" disabled data-tip="POST /_replicate&#10;source: central &#8594; target: esta tablet">↓ Traer cambios del central</button>
    <div class="toast" id="toast" style="margin-top:10px;">Listo.</div>
  </div>

  <div id="tip-float"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  (function(){
    const tip = document.getElementById('tip-float');
    let active = null;
    function place(e){
      tip.style.left = (e.clientX + 14) + 'px';
      tip.style.top = (e.clientY + 14) + 'px';
      requestAnimationFrame(() => {
        const r = tip.getBoundingClientRect();
        if(r.right > innerWidth - 8) tip.style.left = (innerWidth - r.width - 8) + 'px';
        if(r.bottom > innerHeight - 8) tip.style.top = (e.clientY - r.height - 14) + 'px';
      });
    }
    document.addEventListener('mouseover', (e) => {
      const el = e.target.closest('[data-tip]');
      if(!el) return;
      active = el;
      tip.textContent = el.dataset.tip;
      tip.classList.add('show');
      place(e);
    });
    document.addEventListener('mousemove', (e) => { if(active) place(e); });
    document.addEventListener('mouseout', (e) => {
      if(e.target.closest('[data-tip]') === active){ active = null; tip.classList.remove('show'); }
    });
  })();

  const API = 'http://localhost:5986';
  const AUTH = 'Basic ' + btoa('admin:admin123');
  const DB = '/inspecciones';

  const device = document.getElementById('device');
  const toggle = document.getElementById('toggle');
  const toggleLabel = document.getElementById('toggle-label');
  const syncBtn = document.getElementById('sync-btn');
  const pullBtn = document.getElementById('pull-btn');
  const toast = document.getElementById('toast');
  const list = document.getElementById('list');
  const pendingCount = document.getElementById('pending-count');
  let editingId = null;

  function setToast(msg, kind){
    toast.textContent = msg;
    toast.className = 'toast' + (kind ? ' ' + kind : '');
  }

  function api(path, opts={}){
    return fetch(API + path, {
      ...opts,
      headers: { 'Content-Type': 'application/json', 'Authorization': AUTH, ...(opts.headers||{}) }
    });
  }

  let online = false;
  function setOnline(v){
    online = v;
    device.dataset.online = v ? '1' : '0';
    toggleLabel.textContent = v ? 'EN LÍNEA' : 'SIN CONEXIÓN';
    syncBtn.disabled = !v;
    pullBtn.disabled = !v;
  }
  toggle.addEventListener('click', () => setOnline(!online));

  function fmtTime(iso){
    const d = new Date(iso);
    return d.toLocaleTimeString('es-UY', {hour:'2-digit', minute:'2-digit'});
  }

  let lastDocs = [];
  let changedIds = [];
  let prevRevs = {};
  let firstLoad = true;

  async function loadList(){
    if(editingId) return; // no pisar un formulario de edicion abierto
    try{
      const res = await api(DB + '/_changes?include_docs=true&conflicts=true&style=all_docs');
      const data = await res.json();
      const docs = data.results
        .map(r => r.doc)
        .filter(d => d && !d._deleted && d.type === 'lectura_medidor')
        .sort((a,b) => (b.fecha||'').localeCompare(a.fecha||''));
      lastDocs = docs;
      changedIds = firstLoad ? [] : docs.filter(d => prevRevs[d._id] !== d._rev).map(d => d._id);
      prevRevs = Object.fromEntries(docs.map(d => [d._id, d._rev]));
      firstLoad = false;
      render();
    }catch(e){
      list.innerHTML = '<p class="empty">No se pudo conectar al nodo :5986.</p>';
    }
  }

  function render(){
    const docs = lastDocs;
    if(!docs.length){
      list.innerHTML = '<p class="empty">Todavía no cargaste lecturas.</p>';
    } else {
      list.innerHTML = docs.map(d => {
        const conflicted = d._conflicts && d._conflicts.length;
        if(d._id === editingId){
          return `
            <div class="card" data-cardid="${d._id}">
              <div class="card-top">
                <div class="meta">
                  <div class="id">${d._id}</div>
                  <div class="desc">${d.medidor_id} · ${d.zona}</div>
                </div>
              </div>
              <div class="edit-row">
                <input id="edit-input" type="number" step="0.1" value="${d.valor_m3}">
                <button class="btn-mini save" data-save="${d._id}" data-tip="PUT /inspecciones/${d._id}\nActualiza el valor con la _rev actual (nueva revisión)">Guardar</button>
                <button class="btn-mini cancel" data-cancel="1">Cancelar</button>
              </div>
            </div>`;
        }
        return `
          <div class="card" data-cardid="${d._id}">
            <div class="card-top">
              <div class="meta">
                <div class="id">${d._id}</div>
                <div class="desc">${d.medidor_id} · ${d.zona}</div>
                <div class="val">${d.valor_m3} m³ · ${fmtTime(d.fecha)}</div>
              </div>
              <div class="badges">
                ${conflicted ? '<span class="badge conf">⚠ conflicto</span>' : ''}
                <span class="badge ${d.sincronizado ? 'sync' : 'pend'}">${d.sincronizado ? 'sincronizada' : 'pendiente'}</span>
              </div>
            </div>
            <button class="edit-link" data-edit="${d._id}">editar valor</button>
          </div>`;
      }).join('');
    }
    const pending = docs.filter(d => !d.sincronizado).length;
    pendingCount.textContent = pending + (pending === 1 ? ' pendiente' : ' pendientes');

    if(window.gsap && changedIds && changedIds.length){
      changedIds.forEach(id => {
        const el = list.querySelector(`[data-cardid="${CSS.escape(id)}"]`);
        if(el) gsap.fromTo(el, { backgroundColor: '#dcece7' }, { backgroundColor: '#ffffff', duration: 1.1, ease: 'power1.out' });
      });
    }
  }

  list.addEventListener('click', async (ev) => {
    const editId = ev.target.dataset.edit;
    const saveId = ev.target.dataset.save;
    if(editId){ editingId = editId; render(); return; }
    if(ev.target.dataset.cancel){ editingId = null; render(); return; }
    if(saveId){
      const input = document.getElementById('edit-input');
      const valor = parseFloat(input.value);
      const doc = lastDocs.find(d => d._id === saveId);
      if(!doc || Number.isNaN(valor)) return;
      const clean = { ...doc };
      delete clean._conflicts;
      clean.valor_m3 = valor;
      clean.sincronizado = false;
      try{
        const res = await api(DB + '/' + encodeURIComponent(saveId), { method: 'PUT', body: JSON.stringify(clean) });
        if(!res.ok) throw new Error(await res.text());
        setToast('Lectura ' + saveId + ' corregida localmente en la tablet.');
      }catch(e){
        setToast('Error al guardar: ' + e.message, 'err');
      }
      editingId = null;
      loadList();
    }
  });

  document.getElementById('form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const medidor = document.getElementById('medidor').value.trim();
    const zona = document.getElementById('zona').value;
    const valor = parseFloat(document.getElementById('valor').value);
    if(!medidor || Number.isNaN(valor)) return;

    const now = new Date();
    const id = 'lectura:' + now.toISOString().slice(0,10) + ':' + String(Date.now()).slice(-6);
    const doc = {
      _id: id,
      type: 'lectura_medidor',
      medidor_id: medidor,
      zona,
      inspector: 'mgonzalez',
      fecha: now.toISOString(),
      valor_m3: valor,
      sincronizado: false,
      geo: { lat: -34.7 + Math.random()*0.05, lon: -55.98 - Math.random()*0.05 }
    };

    try{
      const res = await api(DB + '/' + encodeURIComponent(id), { method: 'PUT', body: JSON.stringify(doc) });
      if(!res.ok) throw new Error(await res.text());
      setToast('Lectura guardada localmente (' + (online ? 'aún sin sincronizar' : 'sin conexión') + ').');
      ev.target.reset();
      loadList();
    }catch(e){
      setToast('Error al guardar: ' + e.message, 'err');
    }
  });

  syncBtn.addEventListener('click', async () => {
    if(!online) return;
    setToast('Sincronizando con el central…');
    syncBtn.disabled = true;
    try{
      const rep = await api('/_replicate', {
        method: 'POST',
        body: JSON.stringify({
          source: 'http://admin:admin123@localhost:5984/inspecciones',
          target: 'http://admin:admin123@couch-central:5984/inspecciones',
          create_target: false
        })
      });
      if(!rep.ok) throw new Error(await rep.text());
      const repData = await rep.json();
      const written = repData.history && repData.history[0] ? repData.history[0].docs_written : '?';

      const all = await (await api(DB + '/_all_docs?include_docs=true')).json();
      const pendingDocs = all.rows
        .map(r => r.doc)
        .filter(d => d && d.type === 'lectura_medidor' && d.sincronizado === false);

      if(pendingDocs.length){
        const updates = pendingDocs.map(d => ({ ...d, sincronizado: true }));
        await api(DB + '/_bulk_docs', { method: 'POST', body: JSON.stringify({ docs: updates }) });
      }

      setToast('Sincronizado — ' + written + ' documentos enviados al central.', 'ok');
      loadList();
    }catch(e){
      setToast('Error al sincronizar: ' + e.message, 'err');
    } finally {
      syncBtn.disabled = !online;
    }
  });

  pullBtn.addEventListener('click', async () => {
    if(!online) return;
    setToast('Trayendo cambios del central…');
    pullBtn.disabled = true;
    try{
      const rep = await api('/_replicate', {
        method: 'POST',
        body: JSON.stringify({
          source: 'http://admin:admin123@couch-central:5984/inspecciones',
          target: 'http://admin:admin123@localhost:5984/inspecciones',
          create_target: false
        })
      });
      if(!rep.ok) throw new Error(await rep.text());
      const repData = await rep.json();
      const written = repData.history && repData.history[0] ? repData.history[0].docs_written : '?';
      setToast('Actualizado — ' + written + ' documentos recibidos del central.', 'ok');
      loadList();
    }catch(e){
      setToast('Error al traer cambios: ' + e.message, 'err');
    } finally {
      pullBtn.disabled = !online;
    }
  });

  setOnline(false);
  loadList();
  setInterval(loadList, 4000);
</script>
</body>
</html>
