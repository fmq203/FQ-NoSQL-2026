[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reservas-service"
version = "1.0.0"
description = "Reservas & Pagos Service - EventFlow Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "contract: Contract tests",
    "integration: Integration tests",
    "unit: Unit tests",
    "performance: Performance tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "UP", "B", "C4", "PT", "SIM", "TID", "ARG", "PTH", "ERA", "PD", "PGH", "PIE", "PL", "TRY", "NPY", "RSE", "RET", "SLF", "SLOT", "TCH", "INT", "PTH", "FA"]
ignore = ["E501", "E741", "B008", "C901"]
exclude = [".git", "__pycache__", ".pytest_cache", ".hypothesis", "venv", ".venv", "dist", "build", "*.egg-info"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | \.pytest_cache
  | \.hypothesis
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true