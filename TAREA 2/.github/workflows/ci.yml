name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: --health-cmd "mongosh --eval 'db.runCommand({ping: 1})'" --health-interval 10s --health-timeout 5s --health-retries 3
      redis:
        image: redis:7.0-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 3
      postgresql:
        image: postgres:15-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: eventflow
          POSTGRES_USER: eventflow_user
          POSTGRES_PASSWORD: eventflow_password
        options: --health-cmd "pg_isready -U eventflow_user" --health-interval 10s --health-timeout 5s --health-retries 3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./reservas-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest-cov

      - name: Run Ruff (linting)
        working-directory: ./reservas-service
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Run pytest with coverage
        working-directory: ./reservas-service
        env:
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DB: eventflow
          REDIS_URL: redis://localhost:6379
          POSTGRESQL_URI: postgresql://eventflow_user:eventflow_password@localhost:5432/eventflow
          USUARIOS_SERVICE_URL: http://localhost:8001
          EVENTOS_SERVICE_URL: http://localhost:8002
          SERVICE_PORT: 8003
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing --tb=short

      - name: Run dependency vulnerability scan
        working-directory: ./reservas-service
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --desc --format=json > pip-audit-report.json || true
          cat pip-audit-report.json

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: ./reservas-service/coverage.xml
          flags: unittests
          name: codecov-umbrella

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: ./reservas-service/pip-audit-report.json

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: ./reservas-service
        run: |
          docker build -t reservas-service:latest .

      - name: Test Docker image
        working-directory: ./reservas-service
        run: |
          # Quick smoke test - just verify the image can start
          docker run --rm -d --name test-reservas -p 8003:8003 \
            -e MONGODB_URI=mongodb://host.docker.internal:27017 \
            -e REDIS_URL=redis://host.docker.internal:6379 \
            -e POSTGRESQL_URI=postgresql://eventflow_user:eventflow_password@host.docker.internal:5432/eventflow \
            -e USUARIOS_SERVICE_URL=http://host.docker.internal:8001 \
            -e EVENTOS_SERVICE_URL=http://host.docker.internal:8002 \
            reservas-service:latest
          sleep 5
          curl -f http://localhost:8003/health || (docker logs test-reservas && exit 1)
          docker stop test-reservas

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './reservas-service'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'