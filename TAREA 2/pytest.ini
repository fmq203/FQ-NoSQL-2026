[pytest]
# Configuración de pytest para EventFlow

testpaths = usuarios-service/tests eventos-service/tests reservas-service/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio mode
asyncio_mode = auto

# Verbose output
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    saga: SAGA orchestration tests
    slow: Slow tests

# Coverage
[coverage:run]
source = usuarios-service,eventos-service,reservas-service
omit =
    */tests/*
    */venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
